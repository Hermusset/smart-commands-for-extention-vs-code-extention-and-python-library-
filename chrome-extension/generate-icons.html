<!DOCTYPE html>
<html>

<head>
    <title>Generate Icons</title>
</head>

<body>
    <h2>Right-click each canvas and "Save image as..." to create the icon files</h2>
    <p>Save as: icons/icon16.png, icons/icon48.png, icons/icon128.png</p>
    <br>
    <canvas id="c16" width="16" height="16"></canvas> <span>16x16 → icon16.png</span><br><br>
    <canvas id="c48" width="48" height="48"></canvas> <span>48x48 → icon48.png</span><br><br>
    <canvas id="c128" width="128" height="128"></canvas> <span>128x128 → icon128.png</span><br><br>

    <script>
        function drawIcon(canvasId, size) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');

            // Gradient background
            const grad = ctx.createLinearGradient(0, 0, size, size);
            grad.addColorStop(0, '#58a6ff');
            grad.addColorStop(1, '#bc8cff');

            // Rounded rect
            const r = size * 0.18;
            ctx.beginPath();
            ctx.moveTo(r, 0);
            ctx.lineTo(size - r, 0);
            ctx.quadraticCurveTo(size, 0, size, r);
            ctx.lineTo(size, size - r);
            ctx.quadraticCurveTo(size, size, size - r, size);
            ctx.lineTo(r, size);
            ctx.quadraticCurveTo(0, size, 0, size - r);
            ctx.lineTo(0, r);
            ctx.quadraticCurveTo(0, 0, r, 0);
            ctx.closePath();
            ctx.fillStyle = grad;
            ctx.fill();

            // Lightning bolt
            ctx.fillStyle = 'white';
            ctx.beginPath();
            const cx = size / 2;
            const cy = size / 2;
            const s = size * 0.22;
            ctx.moveTo(cx + s * 0.1, cy - s * 1.3);
            ctx.lineTo(cx - s * 0.5, cy + s * 0.1);
            ctx.lineTo(cx + s * 0.05, cy + s * 0.1);
            ctx.lineTo(cx - s * 0.1, cy + s * 1.3);
            ctx.lineTo(cx + s * 0.5, cy - s * 0.1);
            ctx.lineTo(cx - s * 0.05, cy - s * 0.1);
            ctx.closePath();
            ctx.fill();

            // Terminal bracket >_
            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            ctx.font = `bold ${size * 0.22}px monospace`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText('>_', cx, size * 0.92);
        }

        drawIcon('c16', 16);
        drawIcon('c48', 48);
        drawIcon('c128', 128);
    </script>
</body>

</html>
