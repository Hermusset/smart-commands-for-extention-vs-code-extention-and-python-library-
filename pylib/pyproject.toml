[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-terminal-assistant"
version = "1.0.0"
description = "Convert natural English to terminal commands using AI. BYOK - Bring Your Own API Key."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Shoyeb"},
]
keywords = [
    "ai", "terminal", "commands", "cli", "natural-language",
    "git", "docker", "python", "sql", "mongodb", "BYOK"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.28.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]

[project.scripts]
ait = "ai_terminal.cli:main"

[project.urls]
Homepage = "https://github.com/shoyeb/ai-terminal-assistant"
Repository = "https://github.com/shoyeb/ai-terminal-assistant"

[tool.setuptools.packages.find]
include = ["ai_terminal*"]
